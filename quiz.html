<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="quizbox">
            <div class="quiz-header">
                <h1><i class="fa-solid fa-graduation-cap"></i> QuizApp</h1>
            </div>

            <div id="progressContainer" class="progress-container" style="display: none;">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div class="wait-state">
                <div class="state-icon">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <p>Quiz Not started yet</p>
                <button id="startQuiz" type="button">
                    <i class="fa-solid fa-play"></i> Start Quiz
                </button>
            </div>

            <div id="quiz" style="display: none;">
                <div class="quiz-meta">
                    <span id="questionCount" class="badge">Question</span>
                    <span class="badge category"><i class="fa-solid fa-globe"></i> General</span>
                </div>
                <p id="question"></p>
                <div id="options"></div>
                <button id="submit" type="button">
                    <i class="fa-solid fa-circle-check"></i> Submit
                </button>
            </div>

            <div id="results" style="display: none;">
                <div class="state-icon trophy">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2>Quiz Completed!</h2>
                <div class="result-score">
                    <p>Your Score: <span id="scoreText">0 / 5</span></p>
                </div>
                <button id="restartQuiz" type="button" onclick="location.reload()">
                    <i class="fa-solid fa-rotate-right"></i> Play Again
                </button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
